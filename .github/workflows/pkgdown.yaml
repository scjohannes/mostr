name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      MOSTR_RUN_BAYESIAN_VIGNETTE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Preinstall rmsb build helper
        shell: Rscript {0}
        run: install.packages("rstantools")
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::rstantools
            local::.
          needs: website
      - name: Build website
        shell: Rscript {0}
        run: |
          source(".github/check-vignette-output.R")
          pkgdown::check_pkgdown()
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
          for (rd in list.files("man", pattern = "[.]Rd$", full.names = TRUE)) {
            if (!any(grepl("\\\\(eqn|deqn)\\{", readLines(rd)))) next
            page <- file.path("docs/reference", sub("[.]Rd$", ".html", basename(rd)))
            scripts <- xml2::xml_attr(
              xml2::xml_find_all(xml2::read_html(page), "//script[@src]"), "src"
            )
            stopifnot(any(grepl("mathjax", scripts, ignore.case = TRUE)))
          }
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
